<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Halogen regression tests</title>
<body><h1>Halogen regression tests</h1><pre id="results"></pre>
<script src="engine.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/template.js"></script>
<script src="workbook.js"></script>
<script src="assets/engineering-bom.js"></script>
<script src="assets/materials-db.js"></script>
<script src="recognition.js"></script>
<script>
'use strict';
const tests = [];
function test(name, action) { try { action(); tests.push({ name, pass: true }); } catch (error) { tests.push({ name, pass: false, error: error.message }); } }
function assert(condition, message = 'Assertion failed') { if (!condition) throw new Error(message); }
function close(actual, expected) { assert(Math.abs(actual - expected) < 1e-7, `${actual} != ${expected}`); }
const basePart = { name: 'Part', category: 'plastic', quantity: 1, unitMass: 100, mode: 'known', values: { cl: 0, br: 0, f: 0, i: 0 } };
const part = overrides => ({ ...basePart, ...overrides });
test('Mass weighted; quantities applied; metal excluded', () => {
  const result = HalogenEngine.calculate([part({ quantity: 2, values: { cl: 1500, br: 0, f: 0, i: 0 } }), part({}), part({ category: 'metal', unitMass: 10000 })]);
  close(result.plasticMass, 300); close(result.ppm.cl, 1000); assert(result.status === 'pass');
});
test('80 percent boundary passes; above requires review', () => {
  assert(HalogenEngine.calculate([part({ values: { cl: 1200, br: 0, f: 0, i: 0 } })]).status === 'pass');
  assert(HalogenEngine.calculate([part({ values: { cl: 1200.01, br: 0, f: 0, i: 0 } })]).status === 'review');
});
test('At hard limit requires review; above fails', () => {
  assert(HalogenEngine.calculate([part({ values: { cl: 1500, br: 0, f: 0, i: 0 } })]).status === 'review');
  assert(HalogenEngine.calculate([part({ values: { cl: 1500.01, br: 0, f: 0, i: 0 } })]).status === 'fail');
});
test('EN50642 independent element and total envelopes', () => {
  const result = HalogenEngine.calculate([part({ mode: 'compliant' })]);
  close(result.ppm.cl, 1350); close(result.ppm.f, 2700); close(result.ppm.total, 3600); assert(result.status === 'review');
});
test('Worst case resin, FR and additive are summed', () => {
  const result = HalogenEngine.calculate([part({ mode: 'estimated', resin: 'PC', fr: 'FR(16), FR(17) or no info about FR', additive: 'PTFE lubricated part' })]);
  close(result.ppm.br, 90000); close(result.ppm.f, 79000);
});
test('Missing is not zero', () => {
  assert(HalogenEngine.calculate([part({ values: { cl: '', br: 0, f: 0, i: 0 } })]).status === 'incomplete');
  assert(HalogenEngine.calculate([part({ mode: 'unknown' })]).status === 'incomplete');
  assert(HalogenEngine.calculate([]).status === 'incomplete');
  for (const value of ['   ', [], {}, true, false, undefined]) assert(HalogenEngine.number(value) === null);
  assert(HalogenEngine.calculate([part({ unitMass: 1e308 }), part({ unitMass: 1e308 })]).status === 'incomplete');
});
test('Invalid mass, category and concentrations block verdict', () => {
  for (const invalid of [{ unitMass: -1 }, { quantity: 0 }, { unitMass: Infinity }, { category: 'unmapped' }, { values: { cl: -1, br: 0, f: 0, i: 0 } }, { values: { cl: 600000, br: 600000, f: 0, i: 0 } }]) assert(HalogenEngine.calculate([part(invalid)]).status === 'incomplete');
});
test('Product claim requires all evidence; plastic pass is insufficient', () => {
  assert(HalogenEngine.calculate([part({})]).productStatus === 'incomplete');
  const audits = Object.fromEntries(HalogenEngine.AUDIT_KEYS.map(key => [key, { status: 'pass', evidence: 'Supplier declaration' }]));
  assert(HalogenEngine.calculate([part({})], audits).claim === 'product');
  audits.pcb.evidence = ''; assert(HalogenEngine.calculate([part({})], audits).claim === 'plastic-cable');
  audits.pcb.status = 'fail'; assert(HalogenEngine.calculate([part({})], audits).productStatus === 'fail');
});
test('PVC cannot be overridden by checklist', () => {
  const audits = Object.fromEntries(HalogenEngine.AUDIT_KEYS.map(key => [key, { status: 'pass', evidence: 'Checked' }]));
  assert(HalogenEngine.calculate([part({ material: 'Rigid PVC' })], audits).productStatus === 'fail');
});
test('All 13 original parts reproduce cached spreadsheet results', () => {
  const result = HalogenEngine.calculate(HALOGEN_DATA.parts, HALOGEN_DATA.audits);
  assert(result.plasticCount === 13); close(result.grams.br, HALOGEN_DATA.original.brGrams); close(result.grams.f, HALOGEN_DATA.original.fGrams); close(result.ppm.total / 1000000, HALOGEN_DATA.original.totalFraction); assert(result.status === 'fail'); assert(result.productStatus === 'fail');
});
test('Generic BOM maps units, quantity, percent and hierarchy', () => {
  const sheet = { name: 'BOM', rows: [['名称', '单重', '数量', '类别', 'Cl', 'Br', 'F', 'I', '层级'], ['Assembly', 10, 1, '塑料', 0, 0, 0, 0, 0], ['Leaf', 0.1, 2, '塑料', '0.1%', 0, 0, 0, 1]] };
  const header = HalogenWorkbook.findHeader(sheet.rows);
  const imported = HalogenWorkbook.importRows(sheet, header.mapping, { headerRow: 0, massUnit: 'kg', massBasis: 'unit', concentrationUnit: 'ppm', defaultCategory: 'plastic', filename: 'test.csv' });
  assert(imported.excludedParents === 1); close(imported.parts[0].unitMass, 100); close(HalogenEngine.calculate(imported.parts).ppm.cl, 1000);
});
test('Blank numeric cells are retained as unknown', () => {
  const sheet = { name: 'BOM', rows: [['Name', 'Mass(g)', 'Cl', 'Br', 'F', 'I'], ['Part', 10, '', 0, 0, 0]] };
  const header = HalogenWorkbook.findHeader(sheet.rows);
  const imported = HalogenWorkbook.importRows(sheet, header.mapping, { headerRow: 0, massUnit: 'g', massBasis: 'unit', concentrationUnit: 'ppm', defaultCategory: 'plastic', filename: 'test.csv' });
  assert(HalogenEngine.calculate(imported.parts).status === 'incomplete');
});
test('Excel percentage cells and total mass avoid duplicate multiplication', () => {
  const rows = [['Name', 'Mass (kg)', 'Quantity', 'Cl (%)', 'Br (%)', 'F (%)', 'I (%)'], ['Part', 0.2, 2, 0.001, 0, 0, 0]];
  const imported = HalogenWorkbook.importRows({ name: 'BOM', rows, source: { D2: { v: 0.001, z: '0.00%' } } }, HalogenWorkbook.findHeader(rows).mapping, { headerRow: 0, massUnit: 'kg', massBasis: 'total', concentrationUnit: 'auto', defaultCategory: 'plastic', filename: 'test.xlsx' });
  close(imported.parts[0].unitMass, 100); close(HalogenEngine.calculate(imported.parts).plasticMass, 200); close(HalogenEngine.calculate(imported.parts).ppm.cl, 1000);
});
test('Duplicate mappings and invalid hierarchy are rejected', () => {
  const rows = [['Name', 'Mass(g)', 'Level'], ['Part', 10, '1.2']]; const mapping = HalogenWorkbook.findHeader(rows).mapping;
  let errors = 0;
  for (const mapped of [mapping, { ...mapping, name: mapping.unitMass }]) {
    try { HalogenWorkbook.importRows({ name: 'BOM', rows }, mapped, { headerRow: 0, massUnit: 'g', massBasis: 'unit', concentrationUnit: 'ppm', defaultCategory: 'plastic', filename: 'test.csv' }); } catch { errors++; }
  }
  assert(errors === 2);
});
test('Unrecognized SPN and category do not become zero-halogen plastic', () => {
  const rows = [['Name', 'Mass(g)', 'SPN', 'Category'], ['Part', 10, 'MISSING-SPN', 'Unknown type']];
  const imported = HalogenWorkbook.importRows({ name: 'BOM', rows }, HalogenWorkbook.findHeader(rows).mapping, { headerRow: 0, massUnit: 'g', massBasis: 'unit', concentrationUnit: 'ppm', defaultCategory: 'unmapped', filename: 'test.csv' });
  assert(imported.parts[0].mode === 'unknown'); assert(HalogenEngine.calculate(imported.parts).status === 'incomplete');
});
window.testResults = tests;
test('Engineering BOM keeps weighted part and attaches raw material without double count', () => {
  const rows = [['Structure Level','Number','Name','Object Type','Quantity','Mass','Material File Number','RoHS Verdict'], [0,'ROOT','Product','Engineered Part','','','',''], [1,'ASSY','Assembly','Engineered Part',2,100,'',''], [2,'PART','Housing','Engineered Part',3,'1.2E1 g','RAW','Compliant - Verdict from ERIS-2'], [3,'RAW','PBT GF30 FR(17) GREY','Raw Material Part',1,'','',''], [3,'TR','Coating','Treatment Part',1,'','','']];
  const imported = HalogenWorkbook.engineeringStructure({name:'Default',rows});
  assert(imported.parts.length === 1); close(imported.parts[0].quantity,6); close(imported.parts[0].unitMass,12); assert(imported.parts[0].engineering.rawMaterials[0].number === 'RAW'); assert(imported.parts[0].mode === 'unknown'); assert(imported.assemblies === 2);
});
test('Engineering BOM supports already expanded quantities and missing mass stays missing', () => {
  const rows = [['Structure Level','Number','Name','Object Type','Quantity','Mass'], [0,'ROOT','Product','Engineered Part','',''], [1,'PART','Part','Engineered Part',2,''], [2,'RAW','PBT','Raw Material Part',1,500]];
  const imported = HalogenWorkbook.engineeringStructure({name:'Default',rows},{quantityBasis:'expanded'});
  close(imported.parts[0].quantity,2); assert(imported.parts[0].unitMass === null);
});
function renderTests() { document.getElementById('results').textContent = tests.map(result => `${result.pass ? 'PASS' : 'FAIL'} ${result.name}${result.error ? ': ' + result.error : ''}`).join('\n'); }
test('New engineering BOM retains 111 physical parts and 87 raw material links', () => {
  const structure = HalogenWorkbook.engineeringStructure(ENGINEERING_BOM_DATA.sheet);
  assert(structure.parts.length === 111); assert(structure.materialRows === 87); assert(structure.assemblies === 10);
  const recognized = HalogenRecognition.analyze(structure);
  const housing = recognized.parts.find(part => part.spn === 'GHD14201AA');
  assert(housing.category === 'plastic'); close(housing.unitMass,245.95354872657); close(HalogenEngine.evaluatePart(housing).ppm.br,90000);
});
test('Parts without raw material number default to other, out of halogen scope', () => {
  const sticker = HalogenRecognition.recognize({spn:'SIA18279',name:'UL 508 STICKER',mode:'unknown',values:{},quantity:1,unitMass:null,engineering:{rawMaterials:[]}});
  assert(sticker.category === 'other');
  assert(HalogenEngine.evaluatePart(sticker).valid === true);
});
test('Non-plastic categories do not require mass for completeness', () => {
  assert(HalogenEngine.evaluatePart(part({ category: 'metal', unitMass: null })).valid === true);
  assert(HalogenEngine.evaluatePart(part({ category: 'packaging', unitMass: 0 })).valid === true);
  assert(HalogenEngine.evaluatePart(part({ category: 'plastic', unitMass: null })).valid === false);
});
test('Steel material numbers and steel grades are recognized as metal', () => {
  assert(HalogenRecognition.materialInfo({number:'1STE010771', name:'DX51D+Z275-N-A-C'}).category === 'metal');
  assert(HalogenRecognition.materialInfo({name:'S235JR'}).category === 'metal');
  assert(HalogenRecognition.materialInfo({name:'DC01 + C390-MA-RL'}).category === 'metal');
});
test('Steel grades with PC surface-treatment suffix are not mistaken for polycarbonate', () => {
  const info = HalogenRecognition.materialInfo({number:'HUA12401', name:'FT:FT30304 - DC04+ZE25/25-A-PC'});
  assert(info.category === 'metal'); assert(info.pvc === 'no');
});
test('FR codes, PVC and explicit metals are recognized; unmarked FR defaults to No FR', () => {
  assert(HalogenRecognition.materialInfo({name:'Rigid PVC'}).pvc === 'yes');
  assert(HalogenRecognition.materialInfo({name:'PC GF20 FR(17) BLACK'}).fr.includes('FR(16)'));
  assert(HalogenRecognition.materialInfo({name:'PC FR(40) BLACK'}).fr.includes('FR (40)'));
  assert(HalogenRecognition.materialInfo({name:'PC FR(99)'}).mode === 'unknown');
  assert(HalogenRecognition.materialInfo({name:'UP GF30 V0'}).fr === 'No FR');
  assert(HalogenRecognition.materialInfo({name:'EN 10139 - DC03 + C390-MA-RL'}).category === 'metal');
});
test('Imported material database drives explicit resin and flame retardant lookup', () => {
  assert(MATERIALS_DB.records.length === 3464);
  const pvc = HalogenWorkbook.findMaterial('HUA12991'); assert(pvc.resin === 'Rigid PVC' && pvc.fr === 'No FR' && pvc.name === 'PVC medium gloss WHITE');
  const pbt = HalogenWorkbook.findMaterial('HUA33460'); assert(pbt.fr === 'FR(16), FR(17) or no info about FR');
  const vocabulary = new Set(MATERIALS_DB.records.map(record => record.fr));
  assert([...vocabulary].every(fr => fr in HalogenEngine.RETARDANTS), '数据库阻燃剂取值必须落在计算模型内');
});
test('RoHS compliant electronic parts remain halogen pending', () => {
  const recognized = HalogenRecognition.recognize(part({name:'CAPACITOR X123 RoHS compliant',spn:'X123',mode:'unknown',engineering:{rawMaterials:[],rohs:'Compliant - Verdict from ERIS-2'}}));
  assert(recognized.category === 'electronic'); assert(recognized.recognition.halogenStatus === 'pending'); assert(HalogenRecognition.suggestAudits([recognized]).electronic.status === 'pending');
});
test('Colorant mixtures do not silently select the first raw material', () => {
  const structure = HalogenWorkbook.engineeringStructure(ENGINEERING_BOM_DATA.sheet);
  const mixed = HalogenRecognition.analyze(structure).parts.find(part => part.spn === 'NNZ13238');
  assert(mixed.category === 'plastic'); assert(mixed.mode === 'unknown');
});
test('Confirmed model record is revision and raw material specific', () => {
  const component = part({spn:'CAP-1',name:'CAPACITOR',engineering:{revision:'A',rawMaterials:[]}});
  const rule = {id:'rule',number:'CAP-1',revision:'A',fingerprint:'[]',category:'electronic',mode:'unknown',values:{},pvc:'no',halogenStatus:'pass',standard:'JS709C',evidence:'Supplier declaration D1'};
  const recognized = HalogenRecognition.recognize(component,[rule]);
  assert(HalogenRecognition.suggestAudits([recognized]).electronic.status === 'pass');
  assert(HalogenRecognition.recognize({...component,engineering:{revision:'B',rawMaterials:[]}},[rule]).recognition.halogenStatus === 'pending');
});
test('Three claims use 1+6, 1+2+6 and all six conditions independently', () => {
  const audits = {gas:{status:'pass',evidence:'Design verified'}};
  const mixed = [part({}),part({category:'electronic',unitMass:null,recognition:{halogenStatus:'pending'}})];
  const result = HalogenEngine.calculate(mixed,audits);
  assert(result.status === 'pass'); assert(result.claim === 'plastic'); assert(result.claims[0].label === 'Halogen plastics free'); assert(result.claims[1].status === 'incomplete');
  audits.cable = {status:'pass',evidence:'IEC60754 declaration'}; assert(HalogenEngine.calculate(mixed,audits).claim === 'plastic-cable');
  audits.electronic = {status:'fail',evidence:'Supplier noncompliance'}; assert(HalogenEngine.calculate(mixed,audits).claim === 'plastic-cable');
  assert(HalogenEngine.calculate([part({unitMass:null})],audits,'1.0.0').status === 'incomplete');
});
test('PVC check folds into condition 1 and defaults to pass when no PVC found', () => {
  assert(HalogenEngine.AUDIT_KEYS.length === 5); assert(!HalogenEngine.AUDIT_KEYS.includes('pvc'));
  const passAudits = Object.fromEntries(HalogenEngine.AUDIT_KEYS.map(key => [key, { status: 'pass', evidence: 'Checked' }]));
  assert(HalogenEngine.calculate([part({ recognition: { pvc: 'yes' } })], passAudits).conditions[1] === 'fail');
  assert(HalogenEngine.calculate([part({ recognition: { pvc: 'no' } })], passAudits).conditions[1] === 'pass');
  assert(HalogenEngine.calculate([part({ recognition: { pvc: 'unknown' } })], passAudits).conditions[1] === 'pass');
  assert(HalogenEngine.calculate([part({})], passAudits).conditions[1] === 'pass');
  assert(HalogenEngine.calculate([part({})], { ...passAudits, pvc: { status: 'pending' } }).conditions[1] === 'incomplete');
  assert(HalogenEngine.calculate([part({})], { ...passAudits, pvc: { status: 'fail' } }).conditions[1] === 'fail');
});
test('Known electronic failure cannot be overwritten by an audit PASS', () => {
  const audits = Object.fromEntries(HalogenEngine.AUDIT_KEYS.map(key=>[key,{status:'pass',evidence:'Checked'}]));
  const result = HalogenEngine.calculate([part({}),part({category:'electronic',recognition:{halogenStatus:'fail'}})],audits);
  assert(result.productStatus === 'fail'); assert(result.claim === 'plastic-cable');
});
test('Metal standards with multiple digits are recognized', () => {
  for (const name of ['ASTM A311/A311M - G11440 Cl.A-Annealed','JIS G 4314 - SUS 304-WPB-1.8']) assert(HalogenRecognition.materialInfo({name}).category === 'metal');
});
test('Implausible source weight remains traceable but is not included as reliable mass', () => {
  const faulty = HalogenWorkbook.engineeringStructure(ENGINEERING_BOM_DATA.sheet).parts.find(part=>part.spn==='00994093A');
  assert(faulty.unitMass===null); close(faulty.engineering.reportedMass,354516444.32298); assert(!!faulty.engineering.massIssue);
});
test('Local records cannot promote RoHS to electronic halogen-free evidence', () => {
  const record = {number:'X123',category:'electronic',fingerprint:'[]',evidence:'RoHS certificate',halogenStatus:'pass',standard:'RoHS'};
  assert(!HalogenRecognition.validRule(record)); record.standard='JS709C'; assert(HalogenRecognition.validRule(record));
});
renderTests();
(async () => {
  test('Functional electronic parts and cables are not reclassified by plastic raw materials', () => {
    const electronic=HalogenRecognition.recognize(part({name:'CAPACITOR C123',engineering:{rawMaterials:[{number:'RAW',name:'PP NO FR'}]}}));
    assert(electronic.category==='electronic'); assert(electronic.recognition.halogenStatus==='pending');
    const cable=HalogenRecognition.recognize(part({name:'CABLE C123',engineering:{rawMaterials:[{number:'PVC',name:'SOFT PVC'}]}}));
    assert(cable.category==='cable'); assert(cable.recognition.halogenStatus==='fail');
  });
  test('Reidentifying an unmatched previous record does not preserve stale compliance data', () => {
    const stale=HalogenRecognition.recognize(part({name:'UNKNOWN PART',recognition:{source:'user-database'},evidence:'Old declaration'}));
    assert(stale.mode==='unknown'); assert(stale.values.cl===null); assert(stale.evidence==='');
  });
  try {
    const blob = await HalogenWorkbook.exportWorkbook({ product: HALOGEN_DATA.product, parts: HALOGEN_DATA.parts, audits: HALOGEN_DATA.audits, source: HALOGEN_DATA.source, createdAt: new Date().toISOString() });
    const buffer = await blob.arrayBuffer();
    const book = XLSX.read(buffer, { type: 'array' });
    test('Template export reopens with corrected verdict and cached numbers', () => {
      assert(book.Sheets['Halogen Verification '].C18.v === 'FAIL'); assert(book.Sheets.Calculation.G2.v === 'NO'); close(book.Sheets.Calculation.S3.v, HALOGEN_DATA.original.brGrams); assert(!book.SheetNames.includes('Online Audit Trail'));
      const imported = HalogenWorkbook.originalParts(book); close(HalogenEngine.calculate(imported).grams.br, HALOGEN_DATA.original.brGrams);
    });
    const original = await JSZip.loadAsync(HALOGEN_TEMPLATE, { base64: true });
    const exported = await JSZip.loadAsync(buffer);
    let preserved = true;
    for (const name of Object.keys(original.files).filter(name => !original.files[name].dir && !['xl/worksheets/sheet2.xml', 'xl/worksheets/sheet3.xml', 'xl/workbook.xml', 'xl/_rels/workbook.xml.rels', '[Content_Types].xml', 'xl/calcChain.xml'].includes(name))) {
      const before = await original.file(name).async('base64'); const after = await exported.file(name)?.async('base64'); if (before !== after) { preserved = false; break; }
    }
    test('All unrelated template ZIP entries are byte-identical', () => assert(preserved));
    window.exportTestBlob = blob;
    const extendedParts = Array.from({ length: 75 }, (unused, index) => part({ id: `extended-${index}`, name: `Extended ${index}`, quantity: 2, values: { cl: 100, br: 200, f: 300, i: 400 } }));
    const extendedBlob = await HalogenWorkbook.exportWorkbook({ product: HALOGEN_DATA.product, parts: extendedParts, audits: {}, createdAt: new Date().toISOString() });
    const extendedBook = XLSX.read(await extendedBlob.arrayBuffer(), { type: 'array' });
    test('75-part export exceeds legacy ranges without denominator truncation', () => {
      const imported = HalogenWorkbook.originalParts(extendedBook); assert(imported.length === 75); close(HalogenEngine.calculate(imported).plasticMass, 15000); close(extendedBook.Sheets.Calculation.AA3.v, 0.001); assert(extendedBook.Sheets.Calculation.B82.v === 'Extended 74');
    });
    const engineering=HalogenRecognition.analyze(HalogenWorkbook.engineeringStructure(ENGINEERING_BOM_DATA.sheet));
    const engineeringBlob=await HalogenWorkbook.exportWorkbook({product:{name:engineering.root.name,reference:ENGINEERING_BOM_DATA.productReference,bom:engineering.root.number},parts:engineering.parts,audits:engineering.audits,source:ENGINEERING_BOM_DATA.source,createdAt:new Date().toISOString(),methodVersion:'1.1.0'});
    const engineeringBook=XLSX.read(await engineeringBlob.arrayBuffer(),{type:'array'});
    test('Engineering export fills template strictly without audit trail',()=>{
      assert(!engineeringBook.SheetNames.includes('Online Audit Trail'));
      assert(engineeringBook.Sheets['Halogen Verification '].B8.v==='Not Determined');
      assert(engineeringBook.Sheets['Halogen Verification '].B4.v==='Tony ZHUANG');
      const parts=HalogenWorkbook.originalParts(engineeringBook);
      assert(parts.length===27);
      const housing=parts.find(part=>part.spn==='GHD14201AA'); assert(housing); close(HalogenEngine.evaluatePart(housing).ppm.br,90000);
    });
    window.engineeringExportBlob=engineeringBlob;
    const scopes={pvc:{status:'pass',evidence:'Checked'},gas:{status:'pass',evidence:'Checked'},electronic:{status:'pass',evidence:'Manual checklist'}};
    const scopeParts=[part({}),part({category:'electronic',unitMass:null,recognition:{halogenStatus:'fail'}})];
    const scoped=XLSX.read(await (await HalogenWorkbook.exportWorkbook({product:{name:'Scope test'},parts:scopeParts,audits:scopes,methodVersion:'1.1.0'})).arrayBuffer(),{type:'array'});
    test('Export uses plastic claim wording without allowing a manual electronic override',()=>{
      assert(scoped.Sheets['Halogen Verification '].B8.v==='Halogen plastics free');
      assert(scoped.Sheets['Halogen Verification '].C27.v==='FAIL');
    });
    const oversizedBook = XLSX.utils.book_new();
    const oversizedSheet = XLSX.utils.aoa_to_sheet([['Name', 'Mass(g)'], ['First part', 10]]);
    XLSX.utils.sheet_add_aoa(oversizedSheet, [['Hidden tail part', 20]], { origin: 'A20005' });
    XLSX.utils.book_append_sheet(oversizedBook, oversizedSheet, 'BOM');
    let oversizedRejected = false;
    try { await HalogenWorkbook.read(new File([XLSX.write(oversizedBook, { type: 'array', bookType: 'xlsx' })], 'oversized.xlsx')); } catch (error) { oversizedRejected = error.message.includes('20,000'); }
    test('Oversized worksheets are rejected instead of silently truncated', () => assert(oversizedRejected));
  } catch (error) { tests.push({ name: 'Template export', pass: false, error: error.message }); }
  window.testsComplete = true; renderTests();
})();
</script></body></html>
